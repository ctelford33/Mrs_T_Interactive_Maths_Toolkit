<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS4 Venn Diagram Demonstrator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f6f8fb;color:#172033;font:16px Arial,sans-serif}main{max-width:980px;margin:auto;display:grid;gap:9px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:21px;margin:0}.muted{color:#64748b;font-size:13px}button{padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:14px;cursor:pointer}button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button:disabled{opacity:.4;cursor:not-allowed}.panel{background:white;border:1px solid #dbe2ea;border-radius:11px;padding:10px}#tray{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:38px}.num{display:inline-flex;align-items:center;justify-content:center;min-width:39px;height:36px;padding:0 8px;border-radius:8px;background:#eef4ff;border:2px solid #8db3f4;font-weight:bold;cursor:grab;touch-action:none;user-select:none}.num.selected{outline:3px solid #1d4ed8}#diagram{height:min(53vh,440px);min-height:270px;position:relative;background:#fbfdff;border:1px solid #dbe2ea;border-radius:9px;overflow:hidden;touch-action:none}#universe{position:absolute;inset:7% 4%;border:2px solid #202938}#xi{position:absolute;left:8px;top:4px;font-weight:bold;font-size:20px}.circle{position:absolute;top:20%;width:36%;height:60%;border:3px solid #3978d5;border-radius:50%;background:#3978d51c;display:none}#ca{left:27%}#cb{left:47%;border-color:#e77b2e;background:#e77b2e1c}.circle label{position:absolute;top:8px;left:45%;font-weight:bold;font-size:18px;background:#fff9;padding:2px 7px;border-radius:5px}.placed{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #64748b;border-radius:6px;padding:2px 5px;min-width:25px;text-align:center;font-size:14px;font-weight:bold;cursor:grab;touch-action:none;z-index:3;user-select:none;white-space:nowrap}@media(max-width:600px){body{padding:7px}h1{font-size:18px}#diagram{height:48vh;min-height:245px}}
</style></head><body><main>
<header><h1>Venn Diagram Builder · KS4</h1><span class="muted">Drag numbers into the circles or outside them</span></header>
<section class="panel"><strong style="font-size:13px">NUMBERS · drag onto the diagram</strong><div id="tray" style="margin-top:7px"></div></section>
<section class="panel" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button id="rect" class="primary">1 · Draw rectangle + ξ</button><button id="circles" disabled>2 · Draw circles</button><button id="nums" disabled>3 · Show numbers</button><button id="reset">Reset</button><span id="feedback" style="font-size:13px;color:#475569">Start by drawing the universal set.</span></section>
<section class="panel" style="padding:8px">
<div style="display:flex;justify-content:space-around;gap:12px;padding:4px 4px 12px;flex-wrap:wrap"><label>A represents <input id="nameA" value="Even numbers" style="width:160px;max-width:35vw;padding:5px"></label><label>B represents <input id="nameB" value="Multiples of 3" style="width:160px;max-width:35vw;padding:5px"></label></div>
<div id="diagram"><div id="universe" style="display:none"><span id="xi">ξ</span></div><div id="ca" class="circle"><label>A</label></div><div id="cb" class="circle"><label>B</label></div><div id="placed"></div></div>
<div class="muted" style="margin-top:5px">ξ = everything · A ∩ B = overlap · A ∪ B = either set or both · A′ = outside A</div></section>
<section class="panel" style="display:flex;gap:7px;flex-wrap:wrap;align-items:center"><button id="example">Load 1–8 example</button><button id="clear">Return all numbers</button><button id="check">Check placements</button></section>
</main><script>
(()=>{const $=id=>document.getElementById(id);let stage=0,values=[1,2,3,4,5,6,7,8],placed={},drag=null;
const correct=n=>n%2===0&&n%3===0?'both':n%2===0?'a':n%3===0?'b':'outside';
const slots={outside:[[10,25],[10,50],[10,75],[16,25],[16,50],[16,75],[90,25],[90,50]],a:[[35,34],[35,50],[35,66],[40,34],[40,66]],both:[[51,42],[55,42],[59,42],[51,50],[55,50],[59,50],[51,58],[55,58]],b:[[70,34],[70,50],[70,66],[75,34],[75,66]]};
function render(){$('tray').innerHTML='';values.filter(n=>!placed[n]).forEach(n=>{let e=document.createElement('span');e.className='num';e.textContent=n;e.addEventListener('pointerdown',ev=>startDrag(ev,n));$('tray').append(e)});$('placed').innerHTML='';let counts={outside:0,a:0,both:0,b:0};Object.entries(placed).forEach(([n,r])=>{let e=document.createElement('span');e.className='placed';e.textContent=n;let pos=slots[r][counts[r]++]||[55,50];e.style.left=pos[0]+'%';e.style.top=pos[1]+'%';e.addEventListener('pointerdown',ev=>{ev.stopPropagation();startDrag(ev,+n,true)});$('placed').append(e)})}
function update(){ $('universe').style.display=stage>=1?'block':'none';$('ca').style.display=$('cb').style.display=stage>=2?'block':'none';$('rect').disabled=stage>=1;$('circles').disabled=stage<1||stage>=2;$('nums').disabled=stage<2||stage>=3;$('feedback').textContent=stage===0?'Start by drawing the universal set.':stage===1?'Rectangle drawn: ξ labels the universal set.':stage===2?'Circles drawn: label A and B above.':'Drag numbers into the correct regions.';render()}
function regionAt(x,y){let d=$('diagram').getBoundingClientRect(),px=(x-d.left)/d.width*100,py=(y-d.top)/d.height*100;if(stage<1||px<4||px>96||py<7||py>93)return null;let a=stage>=2&&((px-45)/18)**2+((py-50)/30)**2<=1,b=stage>=2&&((px-65)/18)**2+((py-50)/30)**2<=1;return a&&b?'both':a?'a':b?'b':'outside'}
function startDrag(ev,n,fromPlaced=false){if(stage<3)return;ev.preventDefault();let ghost=document.createElement('span');ghost.className='num';ghost.style.position='fixed';ghost.style.zIndex='9999';ghost.style.pointerEvents='none';ghost.style.transform='translate(-50%,-50%)';ghost.textContent=n;document.body.append(ghost);drag={n,ghost,fromPlaced};move(ev);document.addEventListener('pointermove',move);document.addEventListener('pointerup',end,{once:true})}
function move(ev){if(!drag)return;drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px'}
function end(ev){if(!drag)return;let r=regionAt(ev.clientX,ev.clientY);if(r)placed[drag.n]=r;else if(drag.fromPlaced)delete placed[drag.n];drag.ghost.remove();drag=null;document.removeEventListener('pointermove',move);render()}
$('rect').onclick=()=>{stage=1;update()};$('circles').onclick=()=>{stage=2;update()};$('nums').onclick=()=>{stage=3;update()};$('reset').onclick=()=>{stage=0;placed={};values=[1,2,3,4,5,6,7,8];$('nameA').value='Even numbers';$('nameB').value='Multiples of 3';update()};$('example').onclick=()=>{stage=3;placed={};update()};$('clear').onclick=()=>{placed={};render();$('feedback').textContent='All numbers returned to the tray.'};$('check').onclick=()=>{let wrong=Object.entries(placed).filter(([n,r])=>correct(+n)!==r).map(([n])=>n),missing=values.filter(n=>!placed[n]);$('feedback').textContent=(values.length-missing.length-wrong.length)+' correct · '+(wrong.length?'Check '+wrong.join(', ')+'. ':'')+(missing.length?'Still to place: '+missing.join(', '):'All placed!')};update()})();
</script></body></html>
